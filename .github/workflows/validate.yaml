name: Validate with hassfest and HACS 

on:
  push:
    branches: [ main ] 
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test tools
        run: python -m pip install pytest ruff

      - name: Run style checks
        run: ruff check .

      - name: Run static tests
        run: pytest

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 1. HACS-Validierung
      # Prüft hacs.json und Struktur
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration 

      # 2. Hassfest-Prüfungen
      # NEU: Verwendet die offizielle HA-Action, um Installationsfehler zu vermeiden.
      - name: Run hassfest checks
        uses: home-assistant/actions/hassfest@master 
