name: Validate with hassfest and HACS 

on:
  push:
    branches: [ main ] 
  pull_request:
    branches: [ main ]

jobs:
  recorder-compatibility:
    name: Recorder API compatibility (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            ha-version: "2024.10.0"
          - python-version: "3.13"
            ha-version: "latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Home Assistant and test tools
        run: |
          python -m pip install --upgrade pip pytest
          if [ "${{ matrix.ha-version }}" = "latest" ]; then
            python -m pip install homeassistant
          else
            python -m pip install "homeassistant==${{ matrix.ha-version }}"
          fi

      - name: Check required Home Assistant APIs
        run: pytest tests/test_homeassistant_compatibility.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test tools
        run: python -m pip install pytest ruff

      - name: Run style checks
        run: ruff check .

      - name: Run static tests
        run: pytest

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 1. HACS-Validierung
      # Prüft hacs.json und Struktur
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration 

      # 2. Hassfest-Prüfungen
      # NEU: Verwendet die offizielle HA-Action, um Installationsfehler zu vermeiden.
      - name: Run hassfest checks
        uses: home-assistant/actions/hassfest@master 
