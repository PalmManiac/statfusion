analyze:
  name: Analyze a statistics merge
  description: >-
    Analyze two long-term statistics without changing recorder data.
  fields:
    source_statistic_id:
      name: Source statistic ID
      description: The older long-term statistic, for example sensor.old_energy.
      required: true
      selector:
        text:
    target_statistic_id:
      name: Target statistic ID
      description: The newer long-term statistic, for example sensor.new_energy.
      required: true
      selector:
        text:
merge:
  name: Merge hourly statistics
  description: >-
    Copy compatible source long-term statistics into the target. Existing source
    and target rows are preserved unless the explicit overlap choice replaces
    those exact target hours. A full Home Assistant backup, review of warnings,
    and explicit confirmation are required. Unit conversions are blocked.
  fields:
    source_statistic_id:
      name: Source statistic ID
      description: The older long-term statistic whose hourly rows will be copied.
      required: true
      selector:
        text:
    target_statistic_id:
      name: Target statistic ID
      description: The statistic that will receive the missing hourly rows.
      required: true
      selector:
        text:
    collision_resolution:
      name: Overlapping hours
      description: Required for shared hours. Choose old source values or new target values to keep for those hours.
      required: false
      selector:
        select:
          options:
            - label: Keep source values
              value: source
            - label: Keep target values
              value: target
    backup_confirmed:
      name: Full backup created
      description: Confirm that a full Home Assistant backup exists.
      required: true
      selector:
        boolean:
    warnings_confirmed:
      name: Warnings reviewed
      description: Confirm that all analysis warnings have been reviewed.
      required: true
      selector:
        boolean:
    confirm:
      name: Confirm merge
      description: Confirm the selected source and target and start the merge.
      required: true
      selector:
        boolean:
